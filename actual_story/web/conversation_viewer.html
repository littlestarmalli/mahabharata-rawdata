<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahabharata — Conversation View</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #e5ddd5; color: #333; }

/* --- Layout --- */
#layout { display: flex; height: 100vh; }
#nav {
  width: 260px; min-width: 260px; background: #111b21; color: #ccc;
  overflow-y: auto; font-size: 13px; display: flex; flex-direction: column;
}
#nav-header {
  padding: 14px 16px; background: #202c33; border-bottom: 1px solid #2a3942;
  font-size: 16px; font-weight: 600; color: #e9edef;
}
#nav-search {
  padding: 8px 12px; background: #111b21;
}
#nav-search input {
  width: 100%; padding: 7px 12px; border: none; border-radius: 8px;
  background: #202c33; color: #e9edef; font-size: 13px; outline: none;
}
#nav-volumes { flex: 1; overflow-y: auto; }
.vol-group h4 {
  cursor: pointer; padding: 8px 16px; margin: 0; color: #8696a0;
  font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px;
  background: #111b21; border-bottom: 1px solid #222d34;
}
.vol-group h4:hover { background: #202c33; }
.ch-list { display: none; }
.vol-group.open .ch-list { display: block; }
.ch-list a {
  display: block; padding: 10px 16px; color: #e9edef; text-decoration: none;
  font-size: 13px; border-bottom: 1px solid #222d34;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ch-list a:hover { background: #202c33; }
.ch-list a.active { background: #2a3942; }

/* --- Chat area --- */
#chat-area {
  flex: 1; display: flex; flex-direction: column; background: #e5ddd5;
  background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 5 L35 15 L30 12 L25 15Z' fill='%23d4ccc4' opacity='0.3'/%3E%3C/svg%3E");
}
#chat-header {
  padding: 10px 20px; background: #202c33; color: #e9edef;
  display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid #2a3942; min-height: 56px;
}
#chat-header .avatar {
  width: 40px; height: 40px; border-radius: 50%; background: #00a884;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 700; color: #fff;
}
#chat-header .info h3 { font-size: 15px; font-weight: 500; }
#chat-header .info p { font-size: 12px; color: #8696a0; }
#ch-nav {
  padding: 4px 20px; background: #202c33; display: flex; gap: 8px; align-items: center;
}
#ch-nav select, #ch-nav button {
  padding: 4px 10px; border: 1px solid #2a3942; border-radius: 6px;
  background: #2a3942; color: #e9edef; font-size: 12px; cursor: pointer;
}
#messages {
  flex: 1; overflow-y: auto; padding: 12px 60px; display: flex; flex-direction: column;
}

/* --- Message bubbles --- */
.msg { display: flex; margin: 2px 0; max-width: 75%; position: relative; }
.msg-left { align-self: flex-start; }
.msg-right { align-self: flex-end; flex-direction: row-reverse; }
.msg-center { align-self: center; max-width: 90%; }

.msg .avatar {
  width: 28px; height: 28px; min-width: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: #fff; margin-top: 4px;
}
.msg-left .avatar { margin-right: 6px; }
.msg-right .avatar { margin-left: 6px; }

.bubble {
  padding: 6px 12px 6px 12px; border-radius: 10px; position: relative;
  font-size: 14px; line-height: 1.55; word-wrap: break-word;
  box-shadow: 0 1px 1px rgba(0,0,0,0.08);
}
.msg-left .bubble {
  background: #fff; border-top-left-radius: 0;
}
.msg-right .bubble {
  background: #d9fdd3; border-top-right-radius: 0;
}
.msg-center .bubble {
  background: rgba(255,255,255,0.85); font-style: italic;
  border-radius: 8px; text-align: center; opacity: 0.85; font-size: 13px;
  padding: 4px 14px;
}
.speaker-name {
  font-size: 11px; font-weight: 600; margin-bottom: 1px;
  display: inline-block;
}
.unconfirmed {
  display: inline-block; font-size: 10px; color: #e67e22; margin-left: 4px;
  vertical-align: top; cursor: help;
}
.unknown-speaker {
  display: inline-block; font-size: 10px; color: #e74c3c; margin-left: 4px;
  vertical-align: top; cursor: help; font-weight: 600;
}
.conv-badge {
  display: inline-block; font-size: 9px; padding: 1px 5px; border-radius: 3px;
  margin-left: 4px; vertical-align: top; opacity: 0.7;
}
.conv-said { background: #e3f2fd; color: #1565c0; }
.conv-replied { background: #e8f5e9; color: #2e7d32; }
.conv-narration { background: #f5f5f5; color: #757575; }
.msg-depth {
  display: inline-block; font-size: 9px; color: #999; margin-left: 4px;
  vertical-align: top;
}
.bubble .text { }
.bubble .intro-name { font-weight: 700; }

/* Paragraph separator */
.para-sep {
  align-self: center; width: 60%; border: none;
  border-top: 1px dashed #c8bfb6; margin: 10px 0;
}

/* Date-style chapter header */
.chapter-stamp {
  align-self: center; background: #e1f3fb; color: #3b6978;
  padding: 4px 14px; border-radius: 8px; font-size: 12px;
  margin: 12px 0; font-weight: 500;
  box-shadow: 0 1px 1px rgba(0,0,0,0.06);
}

/* Depth indentation */
.msg[data-depth="1"] { padding-left: 16px; }
.msg[data-depth="2"] { padding-left: 32px; }
.msg[data-depth="3"] { padding-left: 48px; }
.msg[data-depth="4"] { padding-left: 64px; }
.msg[data-depth="5"] { padding-left: 80px; }
.msg[data-depth="6"] { padding-left: 96px; }
.msg[data-depth="7"] { padding-left: 112px; }

/* Responsive */
@media (max-width: 768px) {
  #nav { display: none; }
  #messages { padding: 10px 12px; }
  .msg { max-width: 88%; }
}
</style>
</head>
<body>
<div id="layout">

<!-- Sidebar -->
<div id="nav">
  <div id="nav-header">Mahabharata</div>
  <div id="nav-search"><input type="text" placeholder="Search chapter..." oninput="filterChapters(this.value)"></div>
  <div id="nav-volumes"></div>
</div>

<!-- Chat area -->
<div id="chat-area">
  <div id="chat-header">
    <div class="avatar" id="hdr-avatar">M</div>
    <div class="info">
      <h3 id="hdr-title">Mahabharata</h3>
      <p id="hdr-sub">Select a chapter to begin</p>
    </div>
  </div>
  <div id="ch-nav">
    <select id="vol-select" onchange="onVolChange()"></select>
    <select id="ch-select" onchange="loadChapter(this.value)"></select>
    <button onclick="navCh(-1)">◀ Prev</button>
    <button onclick="navCh(1)">Next ▶</button>
  </div>
  <div id="messages"></div>
</div>

</div>

<script>
// ── Volume/chapter layout ──
const VOL_RANGES = [
  [1,199],[200,376],[377,596],[597,832],[833,1008],
  [1009,1150],[1151,1283],[1284,1527],[1528,1737],[1738,1995]
];

// ── Speaker colors (from characters.json) ──
let speakerColors = {};
const FALLBACK_COLOR = '#8696a0';

function getSpeakerColor(id) {
  if (id === 'unknown') return '#95a5a6';
  return (speakerColors[id] && speakerColors[id].color) || FALLBACK_COLOR;
}
function getSpeakerLabel(id) {
  if (id === 'unknown') return '❓ Unknown';
  if (speakerColors[id]) return speakerColors[id].label;
  if (!id) return 'Unknown';
  return id.replace(/^@/, '').replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}
function getInitials(label) {
  const words = label.split(/\s+/);
  if (words.length >= 2) return (words[0][0] + words[1][0]).toUpperCase();
  return label.substring(0, 2).toUpperCase();
}
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ── Load speaker colors ──
async function loadSpeakerColors() {
  try {
    const resp = await fetch('../json/characters.json');
    const chars = await resp.json();
    for (const [cid, info] of Object.entries(chars)) {
      if (!cid.startsWith('@')) continue;
      const disp = info.display;
      if (disp && disp.color) {
        speakerColors[cid] = { color: disp.color, label: disp.label || info.Name || cid };
      }
    }
  } catch(e) { console.warn('Could not load characters.json', e); }
}

// ── Build navigation ──
function buildNav() {
  const volSel = document.getElementById('vol-select');
  const navDiv = document.getElementById('nav-volumes');
  let html = '';
  for (let v = 0; v < 10; v++) {
    const [s, e] = VOL_RANGES[v];
    volSel.innerHTML += '<option value="' + (v+1) + '">Volume ' + (v+1) + '</option>';
    html += '<div class="vol-group" id="vg' + (v+1) + '">';
    html += '<h4 onclick="toggleVol(' + (v+1) + ')">Volume ' + (v+1) + ' (Ch ' + s + '–' + e + ')</h4>';
    html += '<div class="ch-list" id="cl' + (v+1) + '">';
    for (let c = s; c <= e; c++) {
      html += '<a href="#" data-ch="' + c + '" onclick="loadChapter(' + c + ');return false" id="nav' + c + '">Chapter ' + c + '</a>';
    }
    html += '</div></div>';
  }
  navDiv.innerHTML = html;
}

function toggleVol(v) {
  document.getElementById('vg' + v).classList.toggle('open');
}

function onVolChange() {
  const v = parseInt(document.getElementById('vol-select').value);
  const [s, e] = VOL_RANGES[v - 1];
  const sel = document.getElementById('ch-select');
  sel.innerHTML = '';
  for (let c = s; c <= e; c++) {
    sel.innerHTML += '<option value="' + c + '">Chapter ' + c + '</option>';
  }
}

function navCh(dir) {
  const sel = document.getElementById('ch-select');
  const cur = parseInt(sel.value);
  const next = cur + dir;
  if (next >= 1 && next <= 1995) loadChapter(next);
}

function filterChapters(q) {
  q = q.trim().toLowerCase();
  document.querySelectorAll('.ch-list a').forEach(a => {
    a.style.display = a.textContent.toLowerCase().includes(q) || !q ? '' : 'none';
  });
  if (q) document.querySelectorAll('.vol-group').forEach(g => g.classList.add('open'));
}

// ── Render chapter as conversation ──
function renderConversation(data) {
  let h = '';
  h += '<div class="chapter-stamp">Chapter ' + data.chapter + ' — ' + data.shlokas + ' shlokas</div>';

  let lastSpeaker = null;
  let lastAlignment = null;
  let lastDepth = -1;

  for (let pi = 0; pi < data.paragraphs.length; pi++) {
    const para = data.paragraphs[pi];
    if (pi > 0) h += '<div class="para-sep"></div>';

    // Group consecutive segments by same speaker + alignment into one bubble
    let groups = [];
    let cur = null;

    for (const seg of para.segments) {
      const speaker = seg.speaker || '@ugrasrava';
      const conv = seg.conversation || 'narration';
      const align = conv === 'narration' ? 'center' : (conv === 'replied' ? 'right' : 'left');
      const depth = seg.depth || 0;
      const stype = seg.type || 'narration';
      const confirmed = seg.speaker_confirmed !== false;
      const isUnknown = speaker === 'unknown';

      // Skip close-quote-only segments
      if (stype === 'close' && seg.text.trim().length <= 2) continue;

      // Group logic: same speaker + alignment + depth = same bubble
      if (cur && cur.speaker === speaker && cur.align === align && cur.depth === depth) {
        cur.parts.push(seg);
      } else {
        if (cur) groups.push(cur);
        cur = {
          speaker: speaker,
          align: align,
          conv: conv,
          depth: depth,
          stype: stype,
          confirmed: confirmed,
          isUnknown: isUnknown,
          parts: [seg]
        };
      }
    }
    if (cur) groups.push(cur);

    // Render each group as a message bubble
    for (const g of groups) {
      const color = getSpeakerColor(g.speaker);
      const label = getSpeakerLabel(g.speaker);
      const initials = getInitials(label);
      const isCenter = g.align === 'center';
      const isRight = g.align === 'right';
      const cls = isCenter ? 'msg-center' : (isRight ? 'msg-right' : 'msg-left');

      h += '<div class="msg ' + cls + '" data-depth="' + g.depth + '">';

      // Avatar (not for center/narration)
      if (!isCenter) {
        h += '<div class="avatar" style="background:' + color + '">' + esc(initials) + '</div>';
      }

      h += '<div class="bubble">';

      // Speaker name (show when speaker changes or first in paragraph)
      if (!isCenter) {
        h += '<div><span class="speaker-name" style="color:' + color + '">' + esc(label) + '</span>';
        if (g.isUnknown) {
          h += '<span class="unknown-speaker" title="Speaker unknown — pronoun (he/she/they) used, needs manual identification">❓ needs ID</span>';
        } else if (!g.confirmed) {
          h += '<span class="unconfirmed" title="Speaker not explicitly attributed — may need review">⚠</span>';
        }
        // Conversation type badge
        const convCls = g.conv === 'replied' ? 'conv-replied' : (g.conv === 'said' ? 'conv-said' : 'conv-narration');
        h += '<span class="conv-badge ' + convCls + '">' + g.conv + '</span>';
        if (g.depth > 0) {
          h += '<span class="msg-depth">d' + g.depth + '</span>';
        }
        h += '</div>';
      }

      // Text content
      let textHtml = '';
      for (const seg of g.parts) {
        const intro = seg.introduces_label || '';
        if (intro) {
          textHtml += '<span class="intro-name">' + esc(intro) + '</span>' + esc(seg.text.substring(intro.length));
        } else {
          textHtml += esc(seg.text);
        }
      }
      h += '<div class="text">' + textHtml + '</div>';

      h += '</div>'; // .bubble
      h += '</div>'; // .msg
    }
  }

  return h;
}

// ── Load a chapter ──
let currentChapter = 0;
async function loadChapter(ch) {
  ch = parseInt(ch);
  currentChapter = ch;

  // Find volume
  let vol = 1;
  for (let v = 0; v < 10; v++) {
    if (ch >= VOL_RANGES[v][0] && ch <= VOL_RANGES[v][1]) { vol = v + 1; break; }
  }

  // Update nav
  document.getElementById('vol-select').value = vol;
  onVolChange();
  document.getElementById('ch-select').value = ch;
  document.querySelectorAll('.ch-list a.active').forEach(a => a.classList.remove('active'));
  const navEl = document.getElementById('nav' + ch);
  if (navEl) { navEl.classList.add('active'); navEl.scrollIntoView({block:'nearest'}); }

  // Fetch and render
  const url = '../dialogs/volume_' + vol + '/chapter_' + String(ch).padStart(4, '0') + '.json';
  try {
    const resp = await fetch(url);
    const data = await resp.json();

    // Update header
    document.getElementById('hdr-title').textContent = 'Chapter ' + ch;
    document.getElementById('hdr-sub').textContent = data.shlokas + ' shlokas · Volume ' + vol;

    const msgDiv = document.getElementById('messages');
    msgDiv.innerHTML = renderConversation(data);
    msgDiv.scrollTop = 0;
  } catch(e) {
    document.getElementById('messages').innerHTML =
      '<div class="chapter-stamp">Error loading chapter ' + ch + '</div>';
  }
}

// ── Init ──
async function init() {
  await loadSpeakerColors();
  buildNav();
  onVolChange();
  // Load chapter from hash or default
  const hash = parseInt(location.hash.replace('#', ''));
  loadChapter(hash > 0 && hash <= 1995 ? hash : 1);
}

window.addEventListener('hashchange', () => {
  const ch = parseInt(location.hash.replace('#', ''));
  if (ch > 0 && ch <= 1995 && ch !== currentChapter) loadChapter(ch);
});

init();
</script>
</body>
</html>
